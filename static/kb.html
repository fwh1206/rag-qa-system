<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库 · 智答工作台</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-page="kb">
    <nav class="topnav"></nav>

    <div class="app-body">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">知</div>
                <div>
                    <div class="brand-name">知识库管理</div>
                    <div class="brand-sub">KNOWLEDGE BASE</div>
                </div>
            </div>

            <div id="dropZone" class="drop-zone">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>拖拽文件到此处上传</span>
                <span class="drop-sub">PDF / DOC / DOCX / TXT / MD / JSON / XLSX / XLS</span>
            </div>

            <div class="side-actions">
                <label class="btn" for="fileInput">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    上传文件
                </label>
                <input id="fileInput" class="file-input" type="file" accept=".pdf,.txt,.docx,.doc,.md,.xlsx,.xls,.json" multiple>
                <button class="btn" id="textBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                    粘贴文本
                </button>
            </div>

            <label class="field-label">上传分组</label>
            <input id="uploadCategory" class="field-input" type="text" value="默认分组" maxlength="50">

            <div id="uploadProgress" class="upload-progress hidden">
                <div class="upload-progress-bar"><div id="uploadProgressFill" class="upload-progress-fill"></div></div>
                <span id="uploadProgressText" class="upload-progress-text"></span>
            </div>
            <div id="uploadStatus" class="upload-status"></div>

            <div class="side-actions">
                <button class="btn" id="testBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                    检索测试
                </button>
                <button class="btn" id="reindexBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                    重建索引
                </button>
                <button class="btn danger-ghost" id="clearKBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    清空知识库
                </button>
            </div>
        </aside>

        <main class="main">
            <div class="page">
                <div class="page-header">
                    <h1>知识库文档</h1>
                    <p>管理已上传的文档，支持预览、分组筛选、检索测试与重建索引。</p>
                </div>

                <div class="toolbar">
                    <select id="categoryFilter" class="category-select">
                        <option value="">全部分组</option>
                    </select>
                    <span class="spacer"></span>
                    <span id="fileCount" class="panel-count">0</span>
                    <span style="font-size:12px;color:var(--muted)">篇文档</span>
                </div>

                <div class="card">
                    <div class="card-head">文档列表</div>
                    <div class="card-body" style="padding:8px">
                        <div id="fileList" class="file-list" style="min-height:200px"></div>
                        <div id="filePager" class="pager hidden">
                            <button class="btn pager-btn" id="filePrev">上一页</button>
                            <span id="filePageInfo" class="pager-info">1 / 1</span>
                            <button class="btn pager-btn" id="fileNext">下一页</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 粘贴文本弹窗 -->
    <div id="textModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-head">粘贴文本入库</div>
            <div class="modal-body" style="padding:16px 20px;display:flex;flex-direction:column;gap:10px">
                <label class="field-label">目标分组</label>
                <input id="textCategory" class="field-input" type="text" value="默认分组" maxlength="50">
                <label class="field-label">文本内容</label>
                <textarea id="textContent" style="min-height:200px" placeholder="粘贴需要入库的文本内容…"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn" id="closeTextModal">取消</button>
                <button class="btn primary" id="submitText">提交入库</button>
            </div>
        </div>
    </div>

    <!-- 文件预览弹窗 -->
    <div id="previewModal" class="modal-overlay hidden">
        <div class="modal modal-wide">
            <div class="modal-head">
                <span id="previewTitle">文件预览</span>
                <button class="icon-btn" id="closePreview" style="font-size:16px">✕</button>
            </div>
            <div class="preview-meta" id="previewMeta"></div>
            <div class="preview-body" id="previewBody" style="max-height:60vh"></div>
        </div>
    </div>

    <!-- 检索测试弹窗 -->
    <div id="testModal" class="modal-overlay hidden">
        <div class="modal modal-wide">
            <div class="modal-head">
                <span>检索测试</span>
                <button class="icon-btn" id="closeTest" style="font-size:16px">✕</button>
            </div>
            <div class="retrieval-head">
                <input id="testQuestion" class="field-input" type="text" placeholder="输入测试问题…" style="width:100%">
                <div class="side-actions">
                    <button class="btn primary" id="runTest">开始检索</button>
                </div>
            </div>
            <div class="retrieval-results" id="testResults" style="max-height:46vh"></div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        // ============ 知识库页面脚本 ============
        let filePage = 1;
        const PAGE_SIZE = 10;
        const $ = (id) => document.getElementById(id);

        /* 渲染文件列表 */
        function renderFiles(payload) {
            const list = $("fileList");
            const items = payload.file_list || payload.files || [];
            if (!items.length) {
                list.innerHTML = '<div class="empty-block">暂无文档，拖拽文件或点击上传。</div>';
                $("fileCount").textContent = "0";
                return;
            }
            $("fileCount").textContent = payload.total != null ? payload.total : items.length;
            list.innerHTML = items.map((f) => {
                const fname = f.name || f.filename || "";
                const icon = fname.toLowerCase().match(/\.(pdf|docx?|txt|md|xlsx?|json|csv)$/)
                    ? fname.toLowerCase().split(".").pop() : "file";
                const fnameEsc = escapeHtml(fname).replace(/'/g, "\\'");
                return (
                    '<div class="file-row">' +
                    '<div class="file-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg></div>' +
                    '<div class="file-info">' +
                    '<div class="file-name">' + escapeHtml(fname) + '</div>' +
                    '<div class="file-meta">' + formatSize(f.size) + (f.chunk_num != null ? " · " + f.chunk_num + " 片段" : "") + ' · ' +
                    '<span class="file-category">' + escapeHtml(f.category || "默认分组") + '</span></div>' +
                    '</div>' +
                    '<div class="file-tools">' +
                    '<button class="icon-btn" title="预览" onclick="previewFile(\'' + fnameEsc + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>' +
                    '<button class="icon-btn" title="删除" onclick="deleteFile(\'' + fnameEsc + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>' +
                    '</div></div>'
                );
            }).join("");
            updateFilePager(payload.total);
        }

        function updateFilePager(total) {
            const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            $("filePager").classList.toggle("hidden", pages <= 1);
            $("filePageInfo").textContent = filePage + " / " + pages;
            $("filePrev").disabled = filePage <= 1;
            $("fileNext").disabled = filePage >= pages;
        }

        async function refreshFiles() {
            const category = $("categoryFilter").value;
            const params = new URLSearchParams({ page: filePage, page_size: PAGE_SIZE });
            if (category) params.set("category", category);
            const data = await api("/kb/list?" + params.toString());
            renderFiles(data);
        }

        async function loadCategories() {
            try {
                const data = await api("/kb/categories");
                const sel = $("categoryFilter");
                const cats = data.categories || [];
                const current = sel.value;
                sel.innerHTML = '<option value="">全部分组</option>' +
                    cats.map((c) => '<option value="' + escapeHtml(c.name) + '">' + escapeHtml(c.name) + " (" + (c.count || 0) + ")</option>").join("");
                if (current) sel.value = current;
            } catch (e) { /* ignore */ }
        }

        /* 上传 */
        function uploadFileWithProgress(file, category, onProgress) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open("POST", "/upload");
                xhr.setRequestHeader("X-Auth-Token", getAuthToken());
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
                };
                xhr.onload = () => {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (xhr.status >= 400) reject(new Error(data.detail || "上传失败"));
                        else resolve(data);
                    } catch (err) { reject(new Error("响应解析失败")); }
                };
                xhr.onerror = () => reject(new Error("网络错误"));
                const fd = new FormData();
                fd.append("file", file);
                fd.append("category", category);
                xhr.send(fd);
            });
        }

        async function handleUploadFiles(fileList) {
            const category = $("uploadCategory").value.trim() || "默认分组";
            const files = Array.from(fileList);
            if (!files.length) return;
            $("uploadProgress").classList.remove("hidden");
            let ok = 0, fail = 0;
            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                $("uploadProgressText").textContent = "上传中 " + (i + 1) + "/" + files.length + "：" + f.name;
                try {
                    const data = await uploadFileWithProgress(f, category, (p) => {
                        $("uploadProgressFill").style.width = (p * 100).toFixed(0) + "%";
                    });
                    $("uploadProgressText").textContent = "AI 正在分析文档，提取实体和关系：" + f.name;
                    try {
                        await api("/kg/extract?filename=" + encodeURIComponent(data.filename), { method: "POST" });
                    } catch (e) { /* 图谱失败不影响文档入库 */ }
                    ok++;
                } catch (e) {
                    fail++;
                    $("uploadStatus").textContent = f.name + "：" + e.message;
                }
            }
            $("uploadProgressFill").style.width = "0%";
            $("uploadProgress").classList.add("hidden");
            if (ok > 0) toast("成功上传 " + ok + " 个文件");
            if (fail > 0) toast("有 " + fail + " 个文件上传失败", "error");
            await refreshFiles();
            await loadCategories();
        }

        /* 删除 / 清空 / 重建 */
        async function deleteFile(name) {
            if (!confirm("确定删除文档 " + name + " 吗？")) return;
            try {
                await api("/kb/delete?filename=" + encodeURIComponent(name), { method: "DELETE" });
                toast("文档已删除");
                await refreshFiles();
            } catch (e) { toast(e.message, "error"); }
        }

        async function clearKB() {
            if (!confirm("⚠️ 确定清空整个知识库吗？所有文档和向量索引都会被删除，且不可恢复！")) return;
            try {
                await api("/kb/clear_all", { method: "DELETE" });
                toast("知识库已清空");
                await refreshFiles();
                await loadCategories();
            } catch (e) { toast(e.message, "error"); }
        }

        async function reindexKB() {
            if (!confirm("重建索引将重新解析所有文档，可能耗时较长，是否继续？")) return;
            $("reindexBtn").disabled = true;
            try {
                const data = await api("/kb/reindex", { method: "POST" });
                toast(data.msg || "索引重建完成");
            } catch (e) { toast(e.message, "error"); }
            $("reindexBtn").disabled = false;
            await refreshFiles();
        }

        /* 预览 */
        async function previewFile(name) {
            try {
                const data = await api("/kb/preview?filename=" + encodeURIComponent(name));
                $("previewTitle").textContent = name;
                $("previewMeta").textContent = (data.category ? "分组：" + data.category + " · " : "") + "字符数 " + (data.text || "").length;
                $("previewBody").textContent = data.text || "(空文件)";
                $("previewModal").classList.remove("hidden");
            } catch (e) { toast(e.message, "error"); }
        }

        /* 粘贴文本 */
        async function submitText() {
            const content = $("textContent").value.trim();
            if (!content) { toast("请输入文本内容", "error"); return; }
            const category = $("textCategory").value.trim() || "默认分组";
            const docName = "粘贴文本_" + Date.now().toString(36) + ".txt";
            try {
                const data = await api("/upload_text", {
                    method: "POST",
                    body: JSON.stringify({ doc_name: docName, text_content: content, category }),
                });
                toast(data.msg || "文本已入库");
                $("textModal").classList.add("hidden");
                $("textContent").value = "";
                await refreshFiles();
            } catch (e) { toast(e.message, "error"); }
        }

        /* 检索测试 */
        async function runRetrievalTest() {
            const q = $("testQuestion").value.trim();
            if (!q) { toast("请输入问题", "error"); return; }
            $("testResults").innerHTML = '<div class="empty-block">检索中…</div>';
            try {
                const data = await api("/kb/test?question=" + encodeURIComponent(q) + "&top_k=5");
                const hits = data.hits || data.results || [];
                if (!hits.length) {
                    $("testResults").innerHTML = '<div class="empty-block">无命中结果</div>';
                    return;
                }
                $("testResults").innerHTML = hits.map((h, i) => {
                    const sim = h.similarity != null ? h.similarity.toFixed(4) : "-";
                    const rr = h.rerank_score != null ? " · rerank " + h.rerank_score.toFixed(4) : "";
                    return (
                        '<div class="retrieval-item">' +
                        '<div class="source-meta" style="margin-bottom:6px"><span class="badge blue">#' + (i + 1) + '</span>' +
                        '<span class="source-name">' + escapeHtml(h.filename || "未知") + '</span>' +
                        '<span>· chunk ' + h.chunk_index + '</span></div>' +
                        '<div class="source-meta" style="margin-bottom:6px">sim ' + sim + rr + '</div>' +
                        '<div class="retrieval-text">' + escapeHtml(h.document || h.text || "") + '</div>' +
                        '</div>'
                    );
                }).join("");
            } catch (e) { toast(e.message, "error"); }
        }

        /* 事件绑定 */
        document.addEventListener("DOMContentLoaded", async function () {
            const authed = await requireAuth("/login");
            if (!authed) return;
            if (getUserRole() !== "admin") {
                document.querySelector(".page-header h1").textContent = "我的知识库";
                document.querySelector(".page-header p").textContent =
                    "这里只展示你自己上传的文档，支持预览、分组筛选、检索测试与重建索引。";
                document.querySelector(".brand-name").textContent = "我的知识库";
            }
            $("fileInput").addEventListener("change", (e) => { handleUploadFiles(e.target.files); e.target.value = ""; });
            $("dropZone").addEventListener("click", () => $("fileInput").click());
            $("dropZone").addEventListener("dragover", (e) => { e.preventDefault(); $("dropZone").classList.add("dragover"); });
            $("dropZone").addEventListener("dragleave", () => $("dropZone").classList.remove("dragover"));
            $("dropZone").addEventListener("drop", (e) => {
                e.preventDefault(); $("dropZone").classList.remove("dragover");
                handleUploadFiles(e.dataTransfer.files);
            });
            $("textBtn").addEventListener("click", () => $("textModal").classList.remove("hidden"));
            $("closeTextModal").addEventListener("click", () => $("textModal").classList.add("hidden"));
            $("submitText").addEventListener("click", submitText);
            $("closePreview").addEventListener("click", () => $("previewModal").classList.add("hidden"));
            $("previewModal").addEventListener("click", (e) => { if (e.target === $("previewModal")) $("previewModal").classList.add("hidden"); });
            $("testBtn").addEventListener("click", () => $("testModal").classList.remove("hidden"));
            $("closeTest").addEventListener("click", () => $("testModal").classList.add("hidden"));
            $("runTest").addEventListener("click", runRetrievalTest);
            $("testQuestion").addEventListener("keydown", (e) => { if (e.key === "Enter") runRetrievalTest(); });
            $("reindexBtn").addEventListener("click", reindexKB);
            $("clearKBtn").addEventListener("click", clearKB);
            $("filePrev").addEventListener("click", () => { if (filePage > 1) { filePage--; refreshFiles(); } });
            $("fileNext").addEventListener("click", () => { filePage++; refreshFiles(); });
            $("categoryFilter").addEventListener("change", () => { filePage = 1; refreshFiles(); });

            await loadCategories();
            await refreshFiles();
        });
    </script>
</body>
</html>
