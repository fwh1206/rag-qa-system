<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 · 智答工作台</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/common.js"></script>
</head>
<body data-page="profile">
    <nav class="topnav"></nav>

    <div class="app-body">
        <main class="main profile-main">
            <div class="page">
                <div class="page-header profile-header">
                    <div>
                        <h1>个人中心</h1>
                        <p>账号信息、使用概况与工作偏好</p>
                    </div>
                    <div class="header-meta">
                        <span class="status-pill" id="authPill"><span class="status-dot"></span>账号已认证</span>
                    </div>
                </div>

                <section class="profile-hero">
                    <div class="avatar-large" id="avatarLarge">U</div>
                    <div class="hero-info">
                        <div class="hero-name-row">
                            <h2 id="profileName">-</h2>
                            <span class="role-badge" id="profileRole">用户</span>
                            <span class="scope-badge" id="profileScope">个人</span>
                        </div>
                        <div class="hero-meta" id="profileMeta">成员编号 -</div>
                        <div class="hero-meta" id="profileEmail">未绑定邮箱</div>
                        <div class="hero-actions">
                            <a class="btn primary" href="/">回到工作台</a>
                            <a class="btn" href="/history">历史记录</a>
                            <a class="btn" href="/stats">使用统计</a>
                        </div>
                    </div>
                </section>

                <section class="stat-strip">
                    <div class="stat-mini">
                        <span class="stat-mini-icon teal">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        </span>
                        <div><div class="stat-mini-label">我的会话</div><div class="stat-mini-value" id="meSessions">-</div></div>
                    </div>
                    <div class="stat-mini">
                        <span class="stat-mini-icon blue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.38 8.38 0 0 1 8.5 8.5Z"/></svg>
                        </span>
                        <div><div class="stat-mini-label">累计提问</div><div class="stat-mini-value" id="meChats">-</div></div>
                    </div>
                    <div class="stat-mini">
                        <span class="stat-mini-icon amber">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
                        </span>
                        <div><div class="stat-mini-label">知识库文档</div><div class="stat-mini-value" id="meFiles">-</div></div>
                    </div>
                    <div class="stat-mini">
                        <span class="stat-mini-icon green">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z"/><path d="m9 12 2 2 4-4"/></svg>
                        </span>
                        <div><div class="stat-mini-label">检索切片</div><div class="stat-mini-value" id="meChunks">-</div></div>
                    </div>
                </section>

                <div class="profile-grid">
                    <div class="profile-col">
                        <section class="profile-section">
                            <div class="section-head">
                                <div>
                                    <h3>最近动态</h3>
                                    <p>最近 5 次问答记录</p>
                                </div>
                                <a class="text-link" href="/history">查看全部</a>
                            </div>
                            <div id="profileRecent" class="activity-list">
                                <div class="empty-block">加载中...</div>
                            </div>
                        </section>

                        <section class="profile-section">
                            <div class="section-head">
                                <div>
                                    <h3>我的会话</h3>
                                    <p>按最近更新时间排序</p>
                                </div>
                                <a class="text-link" href="/">新建会话</a>
                            </div>
                            <div id="profileSessions" class="session-list">
                                <div class="empty-block">加载中...</div>
                            </div>
                        </section>
                    </div>

                    <div class="profile-col">
                        <section class="profile-section compact">
                            <div class="section-head">
                                <h3>账号安全</h3>
                            </div>
                            <div class="field-stack">
                                <label class="field-label">当前密码</label>
                                <input id="oldPass" class="field-input" type="password" autocomplete="current-password" maxlength="128">
                                <label class="field-label">新密码</label>
                                <input id="newPass" class="field-input" type="password" autocomplete="new-password" minlength="4" maxlength="128">
                                <label class="field-label">确认新密码</label>
                                <input id="newPass2" class="field-input" type="password" autocomplete="new-password" minlength="4" maxlength="128">
                                <button class="btn primary" id="changePassBtn">更新密码</button>
                            </div>
                        </section>

                        <section class="profile-section compact">
                            <div class="section-head">
                                <h3>绑定邮箱</h3>
                            </div>
                            <div class="field-stack">
                                <div class="profile-email-current" id="bindEmailCurrent">当前未绑定邮箱</div>
                                <label class="field-label" for="bindEmail">邮箱</label>
                                <input id="bindEmail" class="field-input" type="email" maxlength="255" placeholder="用于接收验证码和找回密码">
                                <label class="field-label" for="bindCode">验证码</label>
                                <div class="code-row">
                                    <input id="bindCode" class="field-input" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
                                    <button id="sendBindCodeBtn" class="btn" type="button">获取验证码</button>
                                </div>
                                <div id="bindEmailStatus" class="login-error info hidden"></div>
                                <button id="bindEmailBtn" class="btn primary" type="button">绑定邮箱</button>
                            </div>
                        </section>

                        <section class="profile-section compact">
                            <div class="section-head">
                                <h3>偏好设置</h3>
                            </div>
                            <div class="pref-list">
                                <label class="pref-row">
                                    <span>
                                        <span class="pref-name">紧凑布局</span>
                                        <span class="pref-desc">减少页面留白</span>
                                    </span>
                                    <input type="checkbox" id="prefCompact">
                                </label>
                                <label class="pref-row">
                                    <span>
                                        <span class="pref-name">默认展开来源</span>
                                        <span class="pref-desc">回答后直接展示引用</span>
                                    </span>
                                    <input type="checkbox" id="prefSources">
                                </label>
                                <label class="pref-row">
                                    <span>
                                        <span class="pref-name">显示思考过程</span>
                                        <span class="pref-desc">保留推理过程区块</span>
                                    </span>
                                    <input type="checkbox" id="prefThinking">
                                </label>
                                <button class="btn" id="savePrefsBtn">保存偏好</button>
                            </div>
                        </section>

                        <section class="profile-section compact">
                            <div class="section-head">
                                <h3>我的模型服务</h3>
                            </div>
                            <div class="field-stack">
                                <label class="pref-row">
                                    <span>
                                        <span class="pref-name">使用我自己的大模型</span>
                                        <span class="pref-desc">启用后问答使用你配置的 API Key</span>
                                    </span>
                                    <input type="checkbox" id="myLlmEnabled">
                                </label>
                                <label class="field-label" for="myLlmUrl">API 地址（OpenAI 兼容）</label>
                                <input id="myLlmUrl" class="field-input" type="text" maxlength="512" placeholder="https://api.deepseek.com/v1/chat/completions">
                                <label class="field-label" for="myLlmModel">模型名称</label>
                                <input id="myLlmModel" class="field-input" type="text" maxlength="128" placeholder="deepseek-chat / gpt-4o-mini">
                                <label class="field-label" for="myLlmKey">API Key</label>
                                <input id="myLlmKey" class="field-input" type="password" maxlength="512" placeholder="留空表示保持原配置">
                                <div id="myLlmStatus" class="login-error info hidden"></div>
                                <div class="profile-inline-actions">
                                    <button class="btn primary" id="saveMyLlmBtn" type="button">保存我的模型</button>
                                    <button class="btn" id="testMyLlmBtn" type="button">测试模型</button>
                                </div>
                            </div>
                        </section>

                        <section class="profile-section compact">
                            <div class="section-head">
                                <h3>数据工具</h3>
                            </div>
                            <div class="tool-list">
                                <a class="tool-row" href="/history">
                                    <span class="tool-icon">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                    </span>
                                    <span><span class="tool-name">导出对话</span><span class="tool-desc">Markdown 或 JSON</span></span>
                                    <svg class="tool-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="m9 18 6-6-6-6"/></svg>
                                </a>
                                <a class="tool-row" href="/stats">
                                    <span class="tool-icon">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
                                    </span>
                                    <span><span class="tool-name">查看统计</span><span class="tool-desc">知识库与使用概况</span></span>
                                    <svg class="tool-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="m9 18 6-6-6-6"/></svg>
                                </a>
                                <button class="tool-row danger-tool" id="logoutFromProfile">
                                    <span class="tool-icon">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                                    </span>
                                    <span><span class="tool-name">退出登录</span><span class="tool-desc">结束当前会话</span></span>
                                    <svg class="tool-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="m9 18 6-6-6-6"/></svg>
                                </button>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        function applyPrefs(prefs) {
            document.body.classList.toggle("compact-ui", !!prefs.compact);
            if (prefs.sources != null) localStorage.setItem("rag_sources_expanded", prefs.sources ? "1" : "0");
            if (prefs.thinking != null) localStorage.setItem("rag_show_thinking", prefs.thinking ? "1" : "0");
        }

        async function loadProfile() {
            const me = await api("/auth/me");
            const name = me.username || "guest";
            const role = me.role === "admin" ? "管理员" : "普通用户";
            $("profileName").textContent = name;
            $("profileRole").textContent = role;
            $("avatarLarge").textContent = name.slice(0, 1).toUpperCase();
            const memberText = me.created_at ? "成员编号 #" + (me.id || "-") + " · 加入于 " + formatTime(me.created_at) : "成员编号 #" + (me.id || "-");
            $("profileMeta").textContent = memberText;
            $("profileEmail").textContent = me.email ? "邮箱 " + me.email : "未绑定邮箱";
            $("profileScope").textContent = me.role === "admin" ? "系统范围" : "个人范围";
            $("authPill").innerHTML = '<span class="status-dot"></span>账号已认证';
            $("bindEmailCurrent").textContent = me.email ? "已绑定：" + me.email : "当前未绑定邮箱";
        }

        function startBindCountdown(btn) {
            let remaining = 60;
            btn.disabled = true;
            btn.textContent = remaining + "s 后重发";
            btn._timer = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(btn._timer);
                    btn.disabled = false;
                    btn.textContent = "获取验证码";
                    return;
                }
                btn.textContent = remaining + "s 后重发";
            }, 1000);
        }

        async function sendBindCode() {
            const email = $("bindEmail").value.trim().toLowerCase();
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
                $("bindEmailStatus").textContent = "请输入正确的邮箱地址";
                $("bindEmailStatus").classList.remove("hidden");
                return;
            }
            $("sendBindCodeBtn").disabled = true;
            $("sendBindCodeBtn").textContent = "发送中...";
            try {
                const data = await api("/auth/send-code", {
                    method: "POST",
                    body: JSON.stringify({ email, purpose: "bind" }),
                });
                $("bindEmailStatus").textContent = data.dev_mode ? "开发模式验证码：" + data.dev_code : (data.msg || "验证码已发送");
                $("bindEmailStatus").classList.remove("hidden");
                startBindCountdown($("sendBindCodeBtn"));
            } catch (e) {
                $("bindEmailStatus").textContent = e.message;
                $("bindEmailStatus").classList.remove("hidden");
                $("sendBindCodeBtn").disabled = false;
                $("sendBindCodeBtn").textContent = "获取验证码";
            }
        }

        async function bindEmail() {
            const email = $("bindEmail").value.trim().toLowerCase();
            const code = $("bindCode").value.trim();
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
                toast("请输入正确的邮箱地址", "error");
                return;
            }
            if (code.length !== 6) {
                toast("请输入 6 位验证码", "error");
                return;
            }
            try {
                await api("/auth/me/email", {
                    method: "POST",
                    body: JSON.stringify({ email, code }),
                });
                $("bindEmail").value = "";
                $("bindCode").value = "";
                $("bindEmailStatus").classList.add("hidden");
                await loadProfile();
                toast("邮箱绑定成功");
            } catch (e) {
                $("bindEmailStatus").textContent = e.message;
                $("bindEmailStatus").classList.remove("hidden");
                toast("绑定失败：" + e.message, "error");
            }
        }

        async function loadStats() {
            const data = await api("/stats/me");
            $("meSessions").textContent = data.sessions;
            $("meChats").textContent = data.chats;
            $("meFiles").textContent = data.files;
            $("meChunks").textContent = data.chunks;
            const recent = data.recent || [];
            const box = $("profileRecent");
            if (!recent.length) {
                box.innerHTML = '<div class="empty-block">暂无问答记录</div>';
                return;
            }
            box.innerHTML = recent.map((it) =>
                '<a class="activity-item" href="/?session=' + encodeURIComponent(it.session_id) + '">' +
                '<div class="activity-q">' + escapeHtml(it.question) + '</div>' +
                '<div class="activity-a">' + escapeHtml(it.answer || "") + '</div>' +
                '<div class="activity-meta"><span>' + escapeHtml(it.session_id) + '</span><span>' + formatTime(it.created_at) + '</span></div>' +
                '</a>'
            ).join("");
        }

        async function loadSessions() {
            try {
                const data = await api("/sessions/list");
                const items = (data.sessions || []).slice(0, 6);
                const box = $("profileSessions");
                if (!items.length) {
                    box.innerHTML = '<div class="empty-block">暂无会话</div>';
                    return;
                }
                box.innerHTML = items.map((s) =>
                    '<a class="session-row-item" href="/?session=' + encodeURIComponent(s.session_id) + '">' +
                    '<span class="session-dot"></span>' +
                    '<span class="session-name">' + escapeHtml(s.name || s.session_id) + '</span>' +
                    '<span class="session-count">' + (s.message_count || 0) + ' 条</span>' +
                    '<span class="session-time">' + formatTime(s.updated_at) + '</span>' +
                    '</a>'
                ).join("");
            } catch (e) { /* ignore */ }
        }

        async function changePassword() {
            const oldPass = $("oldPass").value;
            const newPass = $("newPass").value;
            const newPass2 = $("newPass2").value;
            if (!oldPass || newPass.length < 4) {
                toast("请填写当前密码并设置至少 4 位新密码", "error");
                return;
            }
            if (newPass !== newPass2) {
                toast("两次输入的新密码不一致", "error");
                return;
            }
            try {
                const data = await api("/auth/password", {
                    method: "POST",
                    body: JSON.stringify({ old_password: oldPass, new_password: newPass }),
                });
                toast(data.msg || "密码已更新");
                $("oldPass").value = "";
                $("newPass").value = "";
                $("newPass2").value = "";
            } catch (e) {
                toast(e.message, "error");
            }
        }

        function savePrefs() {
            const prefs = {
                compact: $("prefCompact").checked,
                sources: $("prefSources").checked,
                thinking: $("prefThinking").checked,
            };
            localStorage.setItem("rag_prefs", JSON.stringify(prefs));
            applyPrefs(prefs);
            toast("偏好已保存");
        }

        async function loadMyLlm() {
            try {
                const data = await api("/auth/me/llm");
                $("myLlmEnabled").checked = !!data.enabled;
                $("myLlmUrl").value = data.url || "";
                $("myLlmModel").value = data.model || "";
                $("myLlmStatus").textContent = data.has_api_key ? "已保存 API Key，留空可保持不变" : "";
                $("myLlmStatus").classList.toggle("hidden", !data.has_api_key);
            } catch (e) {
                toast("模型配置加载失败：" + e.message, "error");
            }
        }

        async function saveMyLlm() {
            const enabled = $("myLlmEnabled").checked;
            const url = $("myLlmUrl").value.trim();
            const model = $("myLlmModel").value.trim();
            if (enabled && (!url || !model)) {
                toast("启用自定义模型时请填写 API 地址和模型名称", "error");
                return;
            }
            try {
                const data = await api("/auth/me/llm", {
                    method: "PUT",
                    body: JSON.stringify({
                        enabled,
                        url,
                        model,
                        api_key: $("myLlmKey").value,
                    }),
                });
                $("myLlmKey").value = "";
                $("myLlmStatus").textContent = data.has_api_key ? "已保存 API Key，留空可保持不变" : "";
                $("myLlmStatus").classList.toggle("hidden", !data.has_api_key);
                toast(data.msg || "我的模型配置已保存");
            } catch (e) {
                toast("保存失败：" + e.message, "error");
            }
        }

        async function testMyLlm() {
            $("testMyLlmBtn").disabled = true;
            $("myLlmStatus").textContent = "正在测试模型连接...";
            $("myLlmStatus").classList.remove("hidden");
            try {
                const data = await api("/auth/me/llm/test", {
                    method: "POST",
                    body: JSON.stringify({
                        url: $("myLlmUrl").value.trim(),
                        model: $("myLlmModel").value.trim(),
                        api_key: $("myLlmKey").value,
                    }),
                });
                $("myLlmStatus").textContent = "模型调用成功：" + (data.reply || "");
                $("myLlmStatus").classList.remove("hidden");
                toast("模型调用成功");
            } catch (e) {
                $("myLlmStatus").textContent = e.message;
                $("myLlmStatus").classList.remove("hidden");
                toast("模型调用失败：" + e.message, "error");
            } finally {
                $("testMyLlmBtn").disabled = false;
            }
        }

        document.addEventListener("DOMContentLoaded", async function () {
            try {
                await requireAuth("/login");
                const saved = JSON.parse(localStorage.getItem("rag_prefs") || "{}");
                $("prefCompact").checked = !!saved.compact;
                $("prefSources").checked = saved.sources != null ? !!saved.sources : true;
                $("prefThinking").checked = saved.thinking != null ? !!saved.thinking : true;
                applyPrefs(saved);
                await Promise.all([loadProfile(), loadStats(), loadSessions(), loadMyLlm()]);
                $("changePassBtn").addEventListener("click", changePassword);
                $("sendBindCodeBtn").addEventListener("click", sendBindCode);
                $("bindEmailBtn").addEventListener("click", bindEmail);
                $("savePrefsBtn").addEventListener("click", savePrefs);
                $("saveMyLlmBtn").addEventListener("click", saveMyLlm);
                $("testMyLlmBtn").addEventListener("click", testMyLlm);
                $("logoutFromProfile").addEventListener("click", doLogout);
            } catch (e) {
                toast(e.message, "error");
            }
        });
    </script>
</body>
</html>
